flight_controller:
  ros__parameters:

    control_frequency: 50.0
    status_frequency: 10.0
    state_timeout: 0.2

    hover:
      speed_threshold: 0.1
      yaw_rate_threshold: 0.1
      settle_duration: 0.3

    controllers:
      position_yaw_pid:
        config_names: ["default", "slow"]

        configs:
          default:
            position_pid:
              kp: 0.8
              ki: 0.0
              kd: 0.0
              max_output: 1.0
              max_output_rate: 5.0
              integral_limit: 1.0
              limit_mode: "norm"

            yaw_pid:
              kp: 0.8
              ki: 0.0
              kd: 0.0
              max_output: 1.0
              max_output_rate: 1.0
              integral_limit: 1.0
              limit_mode: "per_axis"

          slow:
            position_pid:
              kp: 0.8
              ki: 0.0
              kd: 0.0
              max_output: 0.2
              max_output_rate: 0.4
              integral_limit: 1.0
              limit_mode: "norm"

            yaw_pid:
              kp: 0.8
              ki: 0.0
              kd: 0.0
              max_output: 0.5
              max_output_rate: 0.5
              integral_limit: 1.0
              limit_mode: "per_axis"