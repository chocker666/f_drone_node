px4_interface:
  ros__parameters:
    frame_id: map

    offboard_warmup: 1.5
    offboard_retry_interval: 2.0
    connection_timeout: 1.0
    setpoint_timeout: 0.5
    command_timeout: 2.0
    arm_timeout: 5.0

    connection_check_rate: 2.0
    setpoint_publish_rate: 50.0
    offboard_heartbeat_rate: 20.0

    control_modes:
      position: true
      velocity: true
      acceleration: true
      attitude: false
      body_rate: false

    vehicle_status_topic: /fmu/out/vehicle_status_v1
    vehicle_land_detected_topic: /fmu/out/vehicle_land_detected
    battery_status_topic: /fmu/out/battery_status_v1
    vehicle_local_position_topic: /fmu/out/vehicle_local_position_v1
    vehicle_attitude_topic: /fmu/out/vehicle_attitude

    arm_topic: /px4_interface/out/arm
    connected_topic: /px4_interface/out/connected
    landed_topic: /px4_interface/out/landed
    battery_topic: /px4_interface/out/battery
    position_topic: /px4_interface/out/position
    velocity_topic: /px4_interface/out/velocity
    attitude_topic: /px4_interface/out/attitude

    setpoint_topic: /px4_interface/in/setpoint
    arm_service: /px4_interface/in/arm
    vehicle_command_service: /fmu/vehicle_command

    px4_trajectory_setpoint_topic: /fmu/in/trajectory_setpoint
    px4_attitude_setpoint_topic: /fmu/in/vehicle_attitude_setpoint_v1
    px4_rates_setpoint_topic: /fmu/in/vehicle_rates_setpoint
    offboard_control_mode_topic: /fmu/in/offboard_control_mode

    target_system: 1
    target_component: 1
    source_system: 1
    source_component: 1