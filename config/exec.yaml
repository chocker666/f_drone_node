motion_executor:
  ros__parameters:
    topics:
      trajectory: /flight_controller/in/trajectory
      command: /flight_controller/in/command
      control_status: /flight_controller/out/control_status

      position: /px4_interface/out/position
      velocity: /px4_interface/out/velocity
      attitude: /px4_interface/out/attitude
      armed: /px4_interface/out/arm
      landed: /px4_interface/out/landed
      connected: /px4_interface/out/connected

    services:
      arm: /px4_interface/in/arm

    # 阶段 6 接入。
    takeoff:
      default_height: 1.5
      position_tolerance: 0.15
      velocity_tolerance: 0.15
      settle_duration: 0.5
      timeout: 15.0

    # 阶段 2 接入。
    execution:
      check_frequency: 20.0
      state_timeout: 0.3
      tracking_ack_timeout: 1.0
      hover_ack_timeout: 1.0
      stop_timeout: 5.0
      # connected、armed、landed 的独立新鲜度门限。
      status_timeout: 1.5
    observation:
      hover_position_tolerance: 0.15
      hover_yaw_tolerance: 0.10
      hover_velocity_tolerance: 0.15
      hover_settle_duration: 0.5
action_manager:
  ros__parameters:
    check_frequency: 20.0
    feedback_frequency: 5.0

    arm:
      service_wait_timeout: 3.0
      response_timeout: 6.0
      observation_timeout: 2.5
      action_timeout: 15.0