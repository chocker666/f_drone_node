flight_controller:
  ros__parameters:

    # Scheduling
    control_frequency: 50.0
    status_frequency: 10.0
    state_timeout: 0.2

    # Safety: keep disabled until explicitly enabled
    enable_setpoint_stream: false

    # Position PID: position error -> velocity command
    position_pid:
      kp: 0.8
      ki: 0.0
      kd: 0.0

      max_output: 1.0  # m/s
      max_output_rate: 1.0  # m/s2
      integral_limit: 1.0  # m`s

    # Yaw PID: yaw error -> yaw-rate command
    yaw_pid:
      kp: 0.8
      ki: 0.0
      kd: 0.0

      max_output: 1.0  # rad/s
      max_output_rate: 1.0  # rad/s2
      integral_limit: 1.0  # rad`s