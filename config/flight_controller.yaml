flight_controller:
  ros__parameters:

    control_frequency: 100.0
    status_frequency: 10.0
    state_timeout: 0.2

    hover:
      speed_threshold: 0.1       # m/s
      yaw_rate_threshold: 0.1    # rad/s
      settle_duration: 0.3       # s

    position_pid:
      kp: 0.8
      ki: 0.0
      kd: 0.0
      max_output: 1.0           # m/s
      max_output_rate: 1.0      # m/s^2
      integral_limit: 1.0       # m*s

    yaw_pid:
      kp: 0.8
      ki: 0.0
      kd: 0.0
      max_output: 1.0           # rad/s
      max_output_rate: 1.0      # rad/s^2
      integral_limit: 1.0       # rad*s